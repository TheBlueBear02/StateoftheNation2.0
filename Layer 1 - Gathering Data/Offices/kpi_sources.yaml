# kpi_sources.yaml — automation registry for /government/dashboard indexes
# Generated 2026-09-28 from office_dashboard_source.db (48 shown indexes).
# Updated 2026-09-30: added נרצחים (key 63) — now 49 shown indexes.
# tier: A=official API · A'=unofficial JSON · B=structured file · C=PDF+LLM · D=assisted manual
# label_rule: yearly_jan1 (YYYY → YYYY-01-01) · month_start (01.MM.YYYY) · month_end (last day)
# key: stable id from office_dashboard_source.db. The live Supabase index is resolved at runtime by office + name.
# release: when to look for the NEXT period (after the latest point in index_data).
#   monthly  → min_lag_days/max_lag_days after the period's month ends
#   yearly   → window "MM-DD..MM-DD" in the year after the period (may wrap past Dec 31);
#              year_offset: 0 when the figure is published during its own year
#   check_every_days → how often to retry inside the window; after max/window end → overdue (weekly retries + alert)
#   Values are starting guesses; tune them from run history.
# 'TODO' params = endpoint/series id still to confirm in phase 1.

