<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" fill="none">
  <!-- Government building illustration (no flag) -->
  <rect width="640" height="420" fill="#F7FAFD"/>

  <!-- Ground -->
  <rect x="40" y="348" width="560" height="12" fill="#D5E3F4"/>
  <rect x="80" y="360" width="480" height="8" fill="#C2D4EA"/>

  <!-- Pediment -->
  <path d="M110 156 L320 72 L530 156 Z" fill="#E4EEF9" stroke="#4890FD" stroke-width="4" stroke-linejoin="round"/>
  <path d="M170 156 L320 100 L470 156 Z" fill="#FFFFFF" stroke="#6BA4FA" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Cornice -->
  <rect x="108" y="152" width="424" height="18" fill="#4890FD"/>

  <!-- Body -->
  <rect x="120" y="170" width="400" height="178" fill="#EEF4FB" stroke="#4890FD" stroke-width="4"/>

  <!-- Columns -->
  <g fill="#FFFFFF" stroke="#4890FD" stroke-width="3">
    <rect x="152" y="190" width="28" height="158"/>
    <rect x="220" y="190" width="28" height="158"/>
    <rect x="288" y="190" width="28" height="158"/>
    <rect x="356" y="190" width="28" height="158"/>
    <rect x="424" y="190" width="28" height="158"/>
    <rect x="492" y="190" width="28" height="158"/>
  </g>
  <g fill="#6BA4FA">
    <rect x="146" y="182" width="40" height="10"/>
    <rect x="214" y="182" width="40" height="10"/>
    <rect x="282" y="182" width="40" height="10"/>
    <rect x="350" y="182" width="40" height="10"/>
    <rect x="418" y="182" width="40" height="10"/>
    <rect x="486" y="182" width="40" height="10"/>
  </g>
  <g fill="#4890FD">
    <rect x="146" y="340" width="40" height="8"/>
    <rect x="214" y="340" width="40" height="8"/>
    <rect x="282" y="340" width="40" height="8"/>
    <rect x="350" y="340" width="40" height="8"/>
    <rect x="418" y="340" width="40" height="8"/>
    <rect x="486" y="340" width="40" height="8"/>
  </g>

  <!-- Door -->
  <rect x="292" y="270" width="56" height="78" fill="#C7DBF5" stroke="#4890FD" stroke-width="3"/>
  <path d="M292 270 Q320 238 348 270" fill="#FFFFFF" stroke="#4890FD" stroke-width="3"/>

  <!-- Steps -->
  <rect x="248" y="348" width="144" height="12" fill="#AEC8E8"/>
  <rect x="264" y="360" width="112" height="10" fill="#97B7DE"/>
  <rect x="280" y="370" width="80" height="8" fill="#7FA3D2"/>
</svg>
