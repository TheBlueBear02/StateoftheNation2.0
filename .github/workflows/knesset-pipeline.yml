name: knesset-pipeline

on:
  schedule:
    # Saturday midnight Israel (IDT = UTC+3 → Friday 21:00 UTC; in winter IST runs at 23:00 Israel)
    - cron: '0 21 * * 5'
  workflow_dispatch:

concurrency:
  group: knesset-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: 'Layer 1 - Gathering Data/knesset'

      - name: Run knesset pipeline
        run: python load_all_knesset_data.py
        working-directory: 'Layer 1 - Gathering Data/knesset'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIPELINE_RUN_SOURCE: github-actions
