name: knesset-pipeline

on:
  schedule:
    # Daily midnight Israel (IDT = UTC+3 → 21:00 UTC; in winter IST runs at 23:00 Israel)
    - cron: '0 21 * * *'
  workflow_dispatch:

concurrency:
  group: knesset-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Committees: session-scoped OData docs + up to 50 DOC self-parses.
    # Keep headroom above the old 120m cancel on slow Knesset fetches.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: 'Layer 1 - Gathering Data/knesset'

      - name: Run knesset pipeline
        run: python load_all_knesset_data.py
        working-directory: 'Layer 1 - Gathering Data/knesset'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIPELINE_RUN_SOURCE: github-actions

      # antiword: convert Knesset .doc protocols (default transcript path).
      - name: Install antiword for committee protocol self-parse
        run: sudo apt-get update && sudo apt-get install -y antiword

      # Committees for the current Knesset (OData IsCurrent, else knessets.is_active).
      # One-off backfill of a specific term: add --knesset <number>.
      # No Hasadna by default (dumps are stale); memberships left as last synced.
      # Docs: session-scoped OData only (never full-scan DocumentCommitteeSession).
      # Transcripts: newest missing with a protocol DOC (limit 50/run).
      - name: Run knesset committees pipeline
        run: python load_knesset_committees.py --transcripts-mode missing --transcripts-limit 50
        working-directory: 'Layer 1 - Gathering Data/knesset'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIPELINE_RUN_SOURCE: github-actions

      - name: Check knesset data consistency
        if: ${{ !cancelled() }}
        run: python check_knesset_consistency.py
        working-directory: 'Layer 1 - Gathering Data/knesset'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PIPELINE_RUN_SOURCE: github-actions
